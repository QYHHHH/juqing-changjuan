<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>仙逆剧情长卷</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D stage, top/bottom bars float over it as gradients. Left = realm rail, centre-left = story, right = people cards + map, bottom bar = labelled timeline. Single dark look by design. */
:root{
  color-scheme:dark;
  --accent:#f0b46a; --gold:#e6c470; --blood:#ff5a4a; --novel:#bcd0ff; --ink:#05060a; --fg:#f3ece0; --fg2:rgba(243,236,224,.66); --fg3:rgba(243,236,224,.38);
  --bt:clamp(52px,8vh,88px); --bb:clamp(118px,17vh,160px);
  --brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--fg);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;transition:background 1.5s}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.26) 40%,transparent 62%),linear-gradient(0deg,rgba(0,0,0,.45),transparent 30%)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 50%,transparent 50%,rgba(0,0,0,.6) 100%)}
#fade{position:absolute;inset:0;pointer-events:none;opacity:0;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}

/* 顶栏、底栏：渐变叠在画面上，不留黑边 */
.bar{position:absolute;left:0;right:0;z-index:20}
.bar.top{top:0;height:calc(var(--bt) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) clamp(14px,3vw,44px) 0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
.bar.bottom{bottom:0;height:calc(var(--bb) + env(safe-area-inset-bottom,0px));padding:10px clamp(12px,3vw,44px) calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.5) 60%,rgba(0,0,0,0));text-shadow:0 1px 8px rgba(0,0,0,.8)}
.logo{display:flex;align-items:baseline;gap:12px;white-space:nowrap;min-width:0;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.logo b{font-family:var(--brush);font-weight:400;font-size:clamp(22px,3.2vh,34px);letter-spacing:.2em}
.logo span{font-size:11px;letter-spacing:.38em;color:var(--fg2)}
.ctl{display:flex;gap:6px;align-items:center}
.ibtn{height:34px;min-width:34px;padding:0 12px;border:1px solid rgba(255,255,255,.14);border-radius:17px;font-size:12px;letter-spacing:.08em;color:var(--fg2);background:rgba(0,0,0,.28);transition:.25s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ibtn:hover{color:#fff;border-color:var(--accent);box-shadow:0 0 14px -2px var(--accent)}
.ibtn.on{color:#fff;border-color:var(--accent)}
a.ibtn{text-decoration:none}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pl{display:flex;align-items:center;gap:6px}
.pl .ibtn{width:34px;padding:0}
.pl .ibtn.play{width:auto;padding:0 16px}
.count{font-size:12px;letter-spacing:.3em;color:var(--fg2);margin-left:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--accent);font-weight:600;font-size:15px}
.hint{font-size:11px;letter-spacing:.16em;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* timeline */
.tl{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:1;margin-top:4px}
.tl::-webkit-scrollbar{display:none}
.tl-in{position:relative;display:flex;min-width:100%;width:max(100%,var(--w,1000px));height:100%;padding-top:22px}
.track{position:absolute;left:0;width:0;top:calc(22px + 7px);height:1px;background:rgba(255,255,255,.16)}
.fill{position:absolute;left:0;top:-.5px;height:2px;width:0;background:linear-gradient(90deg,transparent,var(--accent));box-shadow:0 0 10px var(--accent)}
.arcs{position:absolute;left:0;right:0;top:0;height:14px;pointer-events:none}
.arc{position:absolute;top:0;font-size:9.5px;letter-spacing:.3em;color:rgba(243,236,224,.26);white-space:nowrap;border-left:1px solid rgba(255,255,255,.1);padding-left:5px;line-height:12px;transition:color .5s}
.arc.cur{color:var(--accent)}
.node{position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.dot{position:relative;width:15px;height:15px;display:grid;place-items:center}
.dot i{display:block;width:7px;height:7px;border-radius:50%;background:#3a3a44;transition:.4s}
.node.seen .dot i{background:var(--accent);opacity:.65}
.node.cur .dot i{width:11px;height:11px;background:#fff;opacity:1;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 18px 3px var(--accent)}
.node.movie .dot i{border-radius:1px;transform:rotate(45deg);width:10px;height:10px;background:#5b5030}
.node.movie.seen .dot i{background:var(--gold);opacity:1}
.node.movie.cur .dot i{background:#fff;box-shadow:0 0 0 4px rgba(230,196,112,.25),0 0 20px 4px var(--gold)}
.node.tbd .dot i{background:none;border:1px dashed var(--gold)}
.node.novel .dot i{background:transparent;border:1px solid rgba(188,208,255,.45);width:8px;height:8px}
.node.novel.seen .dot i{border-color:var(--novel);opacity:1}
.node.novel.cur .dot i{background:#fff;border-color:#fff;width:11px;height:11px}
.node .lb{font-size:11.5px;letter-spacing:.1em;color:var(--fg3);text-align:center;transition:.3s;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.node:hover .lb{color:var(--fg)}
.node.cur .lb{color:#fff;font-weight:600}
.node.movie .lb{color:rgba(230,196,112,.72)}
.node.novel .lb{color:rgba(188,208,255,.55)}
.node .tag{position:absolute;top:-15px;font-size:9.5px;letter-spacing:.2em;white-space:nowrap;color:var(--gold)}
.node.novel .tag{color:var(--novel)}
.node.minor{flex:.6 1 0}
.node.minor .dot i{width:5px;height:5px;background:#2e2e36}
.node.minor.seen .dot i{background:var(--accent);opacity:.5}
.node.minor.cur .dot i{width:9px;height:9px;background:#fff;opacity:1}
.node.minor .lb{font-size:10px;color:rgba(243,236,224,.32);letter-spacing:.06em}
.node.minor.cur .lb{color:#fff}

/* realm rail */
.rail{position:absolute;left:clamp(10px,2.2vw,34px);top:calc(var(--bt) + 3vh);bottom:calc(var(--bb) + 3vh);z-index:10;display:flex;flex-direction:column-reverse;justify-content:space-between;pointer-events:none}
.rl{position:relative;display:flex;align-items:center;gap:9px;height:16px;color:rgba(243,236,224,.24);font-size:10.5px;letter-spacing:.14em;transition:.5s;white-space:nowrap}
.rl::before{content:"";width:8px;height:1px;background:currentColor;transition:.5s}
.rl.got{color:rgba(243,236,224,.62)}
.rl.got::before{width:14px;background:var(--accent)}
.rl.cur{color:#fff;font-size:14px;font-weight:600;text-shadow:0 0 14px var(--accent);text-decoration:none}
.rl.cur::before{width:26px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.rl.foe{color:var(--blood)}
.rl.foe::after{content:"敌";font-size:9px;line-height:13px;padding:0 3px;border:1px solid var(--blood);color:var(--blood);letter-spacing:0;font-weight:400;text-shadow:none}
.rl.cur.foe{color:#fff}
.rl.pulse{animation:rp 1.6s ease}
@keyframes rp{20%{transform:translateX(10px);text-shadow:0 0 26px var(--accent)}100%{transform:none}}

/* content */
#content{position:absolute;left:max(11vw,100px);width:min(44vw,620px);top:var(--bt);bottom:var(--bb);z-index:10;pointer-events:none}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.panel.out{animation:pout .7s forwards}
@keyframes pout{to{opacity:0;filter:blur(8px);transform:translateY(-10px)}}
.ln{opacity:0;transform:translateY(16px);filter:blur(8px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:clamp(8px,2vh,20px)}
.chip{font-size:11.5px;letter-spacing:.16em;padding:4px 11px;border:1px solid rgba(255,255,255,.2);border-radius:99px;color:var(--fg2);background:rgba(0,0,0,.3);backdrop-filter:blur(6px);white-space:nowrap}
.chip.no{border-color:var(--accent);color:var(--accent)}
.chip.movie{border-color:var(--gold);color:#1a1405;background:linear-gradient(120deg,#f7e3a1,#c9a24a);font-weight:600}
.chip.novel{border-color:rgba(188,208,255,.55);color:#dbe5ff}
.chip.loc::before{content:"◈ ";color:var(--accent)}
.chip.rlm::before{content:"✦ ";color:var(--accent)}
h1.ti{font-family:var(--brush);font-weight:400;font-size:clamp(46px,8vw,124px);line-height:1.06;letter-spacing:.06em;background:linear-gradient(180deg,#fff 25%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 30px rgba(0,0,0,.6));text-wrap:balance}
h1.ti.long{font-size:clamp(40px,6.2vw,96px)}
.sub{font-size:clamp(12px,1.5vh,15px);letter-spacing:.42em;color:var(--accent);margin:6px 0 clamp(12px,3vh,26px)}
.txt p{font-size:clamp(14px,2.05vh,19px);line-height:1.95;font-weight:300;text-shadow:0 2px 16px rgba(0,0,0,.95);margin-bottom:.3em;letter-spacing:.06em}
.slate{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:clamp(10px,2.4vh,22px);padding-top:10px;border-top:1px solid rgba(230,196,112,.4);font-size:12px;letter-spacing:.14em;color:var(--gold)}
.slate span b{color:#fff;font-weight:400;margin-left:6px}
.slate .foe b{color:#ffb4a8}
.slate .gap{font-style:normal;margin-left:6px;padding:0 6px;border:1px solid var(--blood);color:var(--blood);font-size:11px}
.again{pointer-events:auto;margin-top:22px;align-self:flex-start;height:40px;padding:0 24px;border:1px solid var(--accent);border-radius:99px;color:#fff;letter-spacing:.3em;font-size:13px}
.again:hover{box-shadow:0 0 22px -2px var(--accent)}
.bigch{position:absolute;right:-2vw;top:50%;transform:translateY(-50%);font-family:var(--brush);font-size:clamp(200px,36vw,540px);line-height:1;color:rgba(255,255,255,.03);pointer-events:none;z-index:-1;user-select:none}

/* people cards */
#cards{position:absolute;right:clamp(14px,3.4vw,56px);top:calc(var(--bt) + 4vh);width:min(290px,25vw);z-index:12;display:flex;flex-direction:column;gap:9px;max-height:calc(100% - var(--bt) - var(--bb) - 8vh - 200px);overflow:hidden}
.cards-h{font-size:10.5px;letter-spacing:.4em;color:var(--fg2);margin-bottom:2px;opacity:0;animation:rise .8s .6s forwards}
.card{display:flex;gap:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.1);border-left:2px solid var(--accent);border-radius:3px;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.28));backdrop-filter:blur(8px);opacity:0;transform:translateX(30px);animation:cin .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d)}
.card.enemy{border-left-color:var(--blood)}
@keyframes cin{to{opacity:1;transform:none}}
.seal{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--brush);font-size:24px;color:#fff;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);box-shadow:0 0 14px -4px var(--accent)}
.card.enemy .seal{border-color:var(--blood);box-shadow:0 0 14px -4px var(--blood)}
.card .n{font-size:15px;letter-spacing:.2em;font-weight:600}
.card .r{font-size:10.5px;letter-spacing:.14em;color:var(--accent);margin:1px 0 3px}
.card.enemy .r{color:#ff9c8c}
.card .d{font-size:12px;line-height:1.6;color:var(--fg2);font-weight:300}

/* map */
.map{position:absolute;right:clamp(14px,3.4vw,56px);bottom:calc(var(--bb) + 2.2vh);width:min(320px,27vw);z-index:12;border:1px solid rgba(255,255,255,.1);border-radius:3px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:8px 10px 6px}
.map .cap{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.3em;color:var(--fg2);margin-bottom:2px}
.map .cap b{color:var(--accent);font-weight:400;letter-spacing:.16em}
.map svg{display:block;width:100%;height:auto}
.mn circle{fill:#4a4a55;transition:.4s}
.mn text{font-size:9.5px;fill:rgba(243,236,224,.4);font-family:var(--serif);letter-spacing:.08em;transition:.4s}
.mn.seen circle{fill:var(--accent);opacity:.8}
.mn.seen text{fill:rgba(243,236,224,.78)}
.mn.cur circle{fill:#fff;opacity:1}
.mn.cur text{fill:#fff;font-weight:600}
.ping{fill:none;stroke:var(--accent);stroke-width:1.2;animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(3.2);opacity:0}}
.route{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:3 3;opacity:.85}
.region{fill:rgba(255,255,255,.025);stroke:rgba(255,255,255,.2);stroke-width:.8;stroke-dasharray:2 3}
.rname{font-size:10px;fill:rgba(243,236,224,.35);letter-spacing:.3em;font-family:var(--serif)}

/* overlays */
#toast{position:absolute;left:62%;top:calc(var(--bt) + 15vh);transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center;opacity:0}
#toast.show{animation:toast 3.4s ease forwards}
#toast small{display:block;font-size:11px;letter-spacing:.7em;color:var(--accent);margin-bottom:6px}
#toast b{font-family:var(--brush);font-weight:400;font-size:clamp(36px,6.4vh,66px);letter-spacing:.3em;color:#fff;text-shadow:0 0 30px var(--accent),0 0 60px var(--accent)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.94);filter:blur(8px)}15%{opacity:1;transform:translate(-50%,0) scale(1);filter:none}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
#card{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:26;text-align:center;pointer-events:none;opacity:0;width:min(92vw,900px)}
#card.show{animation:card 3.2s ease forwards}
#card small{display:block;font-size:12px;letter-spacing:.8em;color:var(--gold);margin-bottom:12px;padding-left:.8em}
#card b{display:block;font-family:var(--brush);font-weight:400;font-size:clamp(56px,10vw,140px);line-height:1.1;letter-spacing:.2em;padding-left:.2em;background:linear-gradient(180deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(230,196,112,.45))}
#card span{display:block;margin-top:10px;font-size:12px;letter-spacing:.5em;color:var(--fg2);padding-left:.5em}
@keyframes card{0%{opacity:0;transform:translate(-50%,-46%) scale(1.06);filter:blur(10px)}16%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}76%{opacity:1}100%{opacity:0;transform:translate(-50%,-54%);filter:blur(6px)}}
#note{position:absolute;left:50%;top:calc(var(--bt) + 14px);transform:translate(-50%,-6px);z-index:40;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:7px 16px;font-size:12px;letter-spacing:.12em;opacity:0;transition:.4s;pointer-events:none;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note.show{opacity:1;transform:translate(-50%,0)}

.bar,.rail,.map,#cards,#content{transition:opacity 1.6s ease}
#app.pre .bar,#app.pre .rail,#app.pre .map,#app.pre #cards,#app.pre #content{opacity:0}

@media(max-width:1100px){.hint{display:none}}
@media(max-width:820px){
  :root{--bb:136px}
  .logo span{display:none}
  #content{left:16px;right:16px;width:auto;top:var(--bt);bottom:calc(var(--bb) + 66px)}
  .panel{justify-content:flex-end;padding-bottom:6px}
  .txt p{font-size:13.5px;line-height:1.8}
  #cards{left:16px;right:16px;top:auto;bottom:calc(var(--bb) + 8px);width:auto;max-height:none;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  #cards::-webkit-scrollbar{display:none}
  .cards-h{display:none}
  .card{flex:none;padding:6px 10px;gap:8px}
  .card .d,.card .r{display:none}
  .seal{width:32px;height:32px;font-size:18px}
  .card .n{font-size:13px;align-self:center}
  .map,.bigch{display:none}
  .scrim{background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.25) 60%,transparent)}
  .ibtn{padding:0 9px}
  #toast{left:50%}
  /* 保留左侧境界栏，缩小显示 */
  .rail{left:6px;top:calc(var(--bt) + 6px);bottom:calc(var(--bb) + 66px)}
  .rl{height:12px;gap:5px;font-size:8.5px;letter-spacing:.06em}
  .rl::before{width:5px}
  .rl.got::before{width:8px}
  .rl.cur{font-size:11px}
  .rl.cur::before{width:12px;height:2px}
  .rl.foe::after{font-size:7.5px;line-height:10px;padding:0 2px}
  #content{left:62px}
}
/* 竖屏版式 */
@media(orientation:portrait){
  .rec{--sl:6vw;--sr:18vw;--su:6vw;--st:12vh;--sb:10vh;--tlh:66px}
  .rec .bar.top{top:var(--st);height:var(--bt);padding:0 var(--su) 0 var(--sl);background:none}
  .rec .bar.top .ctl{display:none}
  .rec .bar.bottom{bottom:0;left:var(--sl);right:var(--sr);height:calc(var(--sb) + var(--tlh));padding:0;flex-direction:column-reverse;justify-content:flex-start;background:none}
  .rec .row1{flex:none;height:var(--sb)}
  .rec .tl{flex:none;height:var(--tlh);margin-top:0}
  .rec .rail{left:var(--sl);top:calc(var(--st) + var(--bt) + 3vh);bottom:calc(var(--sb) + var(--tlh) + 3vh)}
  .rec #content{top:calc(var(--st) + var(--bt));bottom:calc(var(--sb) + var(--tlh))}
  .rec #cards{right:var(--sr);top:calc(var(--st) + var(--bt) + 4vh);max-height:calc(100% - var(--st) - var(--bt) - var(--sb) - var(--tlh) - 8vh - 200px)}
  .rec .map{right:var(--sr);bottom:calc(var(--sb) + var(--tlh) + 2.2vh)}
  .rec #toast{left:50vw}
  .rec #card{left:44vw;width:76vw}
}
@media(orientation:portrait) and (max-width:820px){
  .rec .rail{top:calc(var(--st) + var(--bt) + 6px);bottom:calc(var(--sb) + var(--tlh) + 66px)}
  .rec #content{left:calc(var(--sl) + 56px);right:var(--sr);top:var(--st);bottom:calc(var(--sb) + var(--tlh) + 62px)}
  .rec #cards{left:var(--sl);right:var(--sr);top:auto;bottom:calc(var(--sb) + var(--tlh) + 6px);max-height:none}
}
@media(prefers-reduced-motion:reduce){.ln,.card,.ping{animation-duration:.01s!important;animation-delay:0s!important}}
</style>

</head>
<body>
<div id="app" class="pre">
  <div id="stage"></div>
  <div class="scrim"></div>
  <div class="vig"></div>
  <div id="fade"></div>
  <div id="flash"></div>

  <div class="rail" id="rail" aria-label="修为境界"></div>
  <main id="content" aria-live="polite"></main>
  <aside id="cards" aria-label="关键人物"></aside>
  <div class="map" id="map"></div>
  <div id="toast" aria-hidden="true"><small>境界突破</small><b></b></div>
  <div id="card" aria-hidden="true"><small>剧场版</small><b></b><span></span></div>
  <div id="note" role="status"></div>

  <header class="bar top">
    <div class="logo"><b>仙逆</b><span>剧情长卷 · 动画 · 剧场版 · 原著</span></div>
    <div class="ctl">
      <a class="ibtn" id="bHome" href="../">‹ 海报墙</a>
      <button class="ibtn on" id="bMusic" type="button">♪ 配乐</button>
      <button class="ibtn" id="bFull" type="button" aria-label="全屏">⛶</button>
    </div>
  </header>

  <footer class="bar bottom">
    <div class="row1">
      <div class="pl">
        <button class="ibtn" id="bPrev" type="button" aria-label="上一节点">‹</button>

 {arc:5,title:'击鼓问鼎',short:'问鼎',map:'lianmeng',realm:7,env:'drum',mood:'epic',accent:'#e9bb5e',kw:'鼎',src:'动画正片',
  lines:['鼓声震彻星空，他击鼓问鼎。','道心觉醒，踏入第一步的最后一境。','再往前，便是阴阳二境。'],
  chars:[C('王林','林','问鼎','道心觉醒。')]},
 {arc:6,title:'雷之仙界',short:'雷之仙界',map:'leixian',realm:7,realmNote:'问鼎大圆满',env:'thunder',mood:'tense',accent:'#a99cff',kw:'雷',src:'动画正片',
  lines:['雷之仙界，与李元义结金兰。','周旋于张氏家族之间，将雷道子炼为傀儡。','问鼎大圆满，离下一境只差一线。'],
  chars:[C('李元','元','结拜兄弟','以命相交的生死之交。'),C('雷道子','雷','被炼为傀儡','成了王林手中的一张底牌。',1),C('张氏家族','张','雷之仙界势力','王林周旋其间。')]},
 {arc:6,minor:true,title:'仙人禁山',short:'仙人禁山',map:'leixian',realm:7,env:'thunder',shot:3,mood:'mystic',accent:'#b0a4ff',kw:'山',src:'动画正片 · EP150–151',
  lines:['他随李元登上仙人禁山，破解上古奴印。','远古仙人发疯的真相，在此露出一角。'],
  chars:[C('李元','元','结拜兄弟','识海中的仙人奴印被王林化解。')]},
 {arc:6,title:'弑仙之战',short:'弑仙之战',map:'leixian',realm:9,fromRealm:7,realmNote:'问鼎 → 阳实',film:'2026.10.01',env:'slay',mood:'thunder',accent:'#ffe27a',kw:'弑',src:'剧场版',
  foe:{n:'血祖',r:11},
  lines:['为救女儿姚惜雪，血祖跨星域而来，布下天罗地网。','问鼎对净涅，境界之差如同天堑。','迷阵与琉璃空间之中，王林与李元步步设局。','越级反杀，以弱弑仙。此战跳过阴虚，破境阳实。'],
  chars:[C('血祖','血','仇 · 净涅期','为女跨越星域追杀王林。',1),C('李元','元','并肩布局','与王林联手设局。'),C('姚惜雪','雪','血祖之女','引血祖入局的关键。')]},
 {arc:6,minor:true,title:'千里救友',short:'千里救友',map:'leixian',realm:9,env:'thunder',shot:2,mood:'tense',accent:'#c0b4ff',kw:'救',src:'动画正片 · EP152',
  lines:['破境阳实，他换上了新的面容。','李元遭人追杀，他撕裂虚空，千里驰援。'],
  chars:[C('李元','元','结拜兄弟','曾分他破灭心种，以命相交。')]},
 {arc:6,title:'阴仙府',short:'阴仙府',map:'yinxian',realm:9,env:'cave',mood:'mystic',accent:'#b781ff',kw:'魔',src:'动画正片 · EP152–153',
  lines:['与李元同探阴仙府暗洞，误解封印。','清水仙君的杀戮魔念，就此苏醒。','死里逃生，他独闯藏品阁。'],
  chars:[C('李元','元','结拜兄弟','与王林同探暗洞。'),C('清水仙君','清','杀戮魔念','封印中的右眼魔念苏醒。',1)]},
 {arc:6,minor:true,title:'九层藏品阁',short:'藏品阁',map:'yinxian',realm:9,env:'cave',shot:1,mood:'tense',accent:'#c09aff',kw:'阁',src:'动画正片 · EP153–154',
  lines:['四名阳实守卫，先后倒在他手下。','借青霜遗体通过仙缘检测，直上九层。','白凡仙帝留下的仙术，终入他手。'],
  chars:[C('青霜仙君','霜','已故仙君','遗体成了通关之钥。'),C('白凡仙帝','凡','雷之仙界仙帝','在第九层留下遗术。')]},
 {arc:6,minor:true,title:'古画悟道',short:'古画悟道',map:'yinxian',realm:9,env:'scroll',mood:'mystic',accent:'#ffd890',kw:'画',src:'动画正片 · EP154',
  lines:['古画展开，白凡仙帝的虚影现身。','他在画中悟道，习得呼风仙术。'],
  chars:[C('白凡仙帝','凡','雷之仙界仙帝','以画中虚影传下仙术。')]},
 {arc:6,minor:true,title:'逃离雷界',short:'逃离雷界',map:'leixian',realm:9,env:'thunder',shot:3,mood:'thunder',accent:'#a99cff',kw:'逃',src:'动画正片 · EP157 · 动画最新进度',
  lines:['仙门已毁，雷之仙界将倾，生路只剩一线。','清水仙君恢复记忆追杀而来，他终逃出雷之仙界。'],
  chars:[C('清水仙君','清','白发追杀者','恢复记忆，与王林恶战。',1),C('炎雷子','炎','雷界强者','助王林脱身。')]},
 {arc:7,title:'异界骗局',short:'院线剧场版',map:'yijie',realm:9,realmNote:'待公布',film:'待映',tbd:true,env:'portal',mood:'cosmic',accent:'#ebd28e',kw:'天',src:'院线剧场版',
  lines:['为夺宝物踏入异界，却深陷一场惊天骗局。','从冷眼旁观，到与众生共战。','斩破虚伪天道之时，他窥见更残酷的真相。'],
  chars:[C('众生','众','共战者','由冷眼旁观到与众生共战。')]},
 {arc:8,novel:true,title:'青灵悟道',short:'窥涅',map:'qingling',realm:10,env:'scry',mood:'mystic',accent:'#cfe0ff',kw:'窥',src:'原著小说 · 动画未播',
  foe:{n:'血神子',r:-1},
  lines:['东临星上，师兄清水挡下追杀。','青灵星上，他梦中悟道。','窥见天地规则，踏入窥涅。'],
  chars:[C('清水','清','师兄 · 碎涅圆满','罗天星域的杀戮第一人。'),C('血神子','神','追杀者','受古魔操控，一路追杀。',1),C('血祖','血','宿敌','阳实时已被收入魂幡。',1)]},
 {arc:8,novel:true,title:'朱雀圣皇',short:'净涅',map:'sisheng',realm:11,env:'saint',mood:'epic',accent:'#ffb070',kw:'皇',src:'原著小说 · 动画未播',
  foe:{n:'八星古魔塔珈',r:-1},
  lines:['青霖洞府之中，朱雀印记觉醒。','八星古魔夺舍青霖，王林拼死力战。','四圣宗尊他为朱雀圣皇，他晋升净涅。'],
  chars:[C('青霖','霖','师尊','遭古魔夺舍，后得复生。'),C('塔珈','魔','八星古魔','夺舍青霖的大敌。',1),C('天运子','运','暗敌','在暗处布局的老对手。',1)]},
 {arc:8,novel:true,title:'云海碎涅',short:'碎涅',map:'yunhai',realm:12,fromRealm:11,env:'shatter',mood:'tense',accent:'#ff8a9a',kw:'碎',src:'原著小说 · 动画未播',
  foe:{n:'水道子',r:14},
  lines:['归元宗大比，他叱咤无极。','水道子亲自出手，王林被石化。','李倩梅十年涂血相救，碎涅天劫轰然落下。'],
  chars:[C('水道子','水','神宗大长老 · 空涅初期','云海星域第二强者，终被王林所杀。',1),C('李倩梅','梅','知己','十年涂血，救他脱困。'),C('蓝梦道尊','梦','太古五尊之一','空玄巅峰，亦敌亦师。')]},
 {arc:8,novel:true,title:'轰开空门',short:'空灵',map:'jiewai',realm:15,realmNote:'碎涅 → 空灵',env:'gates',mood:'cosmic',accent:'#a8c8ff',kw:'空',src:'原著小说 · 动画未播',
  lines:['不修香火，不渡天人五衰。','古神为掌，五大本源为指。','六座空门接连轰碎，直入第三步空灵。'],
  chars:[C('一代朱雀','雀','考验者','在颠落之地问他修真之路。'),C('清水','清','师兄','赠他杀戮本源。'),C('拓森','森','宿敌','界外追杀的强敌。',1)]},
 {arc:8,novel:true,title:'玄劫降临',short:'空玄',map:'xiangang',realm:16,env:'galaxy',mood:'cosmic',accent:'#9fb4ff',kw:'玄',src:'原著小说 · 动画未播',
  lines:['踏入仙罡大陆，九大本源齐聚，迈入空玄。','道魔宗追杀而至，他遁入天逆珠潜修。','九重玄劫降下，雷、土、水三尊真身凝成。'],
  chars:[C('道魔宗老祖','魔','追杀者','斗法落败，宗门覆灭。',1),C('绿魔蝎魂','蝎','夺舍者','欲夺舍王林，未能得逞。',1)]},
 {arc:8,novel:true,title:'大天尊之阳',short:'空劫',map:'xiangang',realm:17,env:'calamity',mood:'thunder',accent:'#ffd27a',kw:'劫',src:'原著小说 · 动画未播',
  foe:{n:'仙皇',r:-1},

  chars:[C('仙皇','皇','仙族之主','率众围杀王林，终败。',1),C('连道非','连','同伴','曾救王林于危难。')]},
 {arc:8,novel:true,title:'踏天',short:'踏天',map:'taigu',realm:18,env:'tread',mood:'epic',accent:'#ffe9b0',kw:'逆',src:'原著小说 · 大结局',end:true,
  foe:{n:'天运子 · 半步踏天',r:-1},
  lines:['悟透轮回，他走完踏天九桥。','定界罗盘器灵天运子被禁锢，一界本源尽数抽离。','以本源重塑肉身，婉儿睁开了眼。','二人化作长虹，没入暮色天际。'],
  chars:[C('天运子','运','定界罗盘器灵','半步踏天，欲夺舍王林。',1),C('李慕婉','婉','妻子','以一界本源复生。'),C('李倩梅','梅','知己','目送二人远去。')]},

    ctx=(()=>{try{if(window.parent!==window&&window.parent.__xnCtx)return window.parent.__xnCtx}catch(e){}return null})()||new AC();master=ctx.createGain();master.gain.value=0;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    const sr=ctx.sampleRate,len=sr*3.4,ir=ctx.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    const cv=ctx.createConvolver();cv.buffer=ir;verbSend=ctx.createGain();verbSend.gain.value=.7;verbSend.connect(cv);cv.connect(master);
    noiseBuf=ctx.createBuffer(1,sr*2,sr);{const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    droneG=ctx.createGain();droneG.gain.value=0;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=360;lp.Q.value=.7;
    ['sawtooth','sawtooth','sine','sine'].forEach((ty,i)=>{const o=ctx.createOscillator();o.type=ty;o.frequency.value=73;const g=ctx.createGain();g.gain.value=i<2?.5:1;o.connect(g);g.connect(lp);o.start();droneO.push(o)});lp.connect(droneG);out(droneG,0,.6);
    rumbleG=ctx.createGain();rumbleG.gain.value=0;const rn=ctx.createBufferSource();rn.buffer=noiseBuf;rn.loop=true;const rl=ctx.createBiquadFilter();rl.type='lowpass';rl.frequency.value=130;rn.connect(rl);rl.connect(rumbleG);rumbleG.connect(master);rn.start();
    nextT=ctx.currentTime+.2;setInterval(tick,80);setMood(Object.keys(M).find(k=>M[k]===mood)||'calm');applyVol();return true}
  // 在用户手势里解锁：播一段静音并立即 resume（iOS 只认 touchend/click 里的调用）
  function unlock(){if(!ctx)return;try{const s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,ctx.sampleRate);s.connect(ctx.destination);s.start(0)}catch(e){}
    if(ctx.state!=='running')ctx.resume().then(applyVol,()=>{});applyVol()}
  return{start,setMood,crack,swell,rise,unlock,onState(cb){if(ctx)ctx.addEventListener('statechange',cb)},get on(){return on},get state(){return ctx?ctx.state:'none'},toggle(){on=!on;applyVol()},resume(){applyVol()},setPlaying(p){if(p===playing)return;playing=p;applyVol()},setHidden(h){hidden=h;applyVol()}};
})();
if(GL)GL.onCrack=()=>Music.crack();
let noteT;function note2(m){const n=$('#note');n.textContent=m;n.classList.add('show');clearTimeout(noteT);noteT=setTimeout(()=>n.classList.remove('show'),3000)}

/* ====================== 界面 ====================== */
const content=$('#content'),cards=$('#cards'),mapEl=$('#map'),rail=$('#rail'),tlIn=$('#tlIn'),fillEl=$('#fill');
document.documentElement.style.setProperty('--n',N);
{const mj=NODES.filter(n=>!n.minor).length;document.documentElement.style.setProperty('--w',(mj*70+(N-mj)*44)+'px')}
{const CNs='零一二三四五六七八九';let mj=0,sub=0;NODES.forEach(c=>{if(c.prologue){c.label='序章'}else if(c.minor){sub++;c.label=`第 ${String(mj).padStart(2,'0')} 幕 · 续${CNs[sub]||sub}`}else{mj++;sub=0;c.label=`第 ${String(mj).padStart(2,'0')} 幕`}})}
let firstNovel=true;
NODES.forEach((c,i)=>{
  const b=document.createElement('button');b.type='button';b.className='node'+(c.film?' movie':'')+(c.tbd?' tbd':'')+(c.novel?' novel':'')+(c.minor?' minor':'');
  b.title=`${String(i+1).padStart(2,'0')} ${c.title} — ${MAPN[c.map].n} · ${c.realmNote||R[c.realm]}`;
  let tag='';if(c.film)tag='<span class="tag">剧场版</span>';else if(c.novel&&firstNovel){tag='<span class="tag">原著</span>';firstNovel=false}
  b.innerHTML=`${tag}<span class="dot"><i></i></span><span class="lb">${c.short}</span>`;
  b.onclick=()=>{Timeline.go(i);Music.resume()};tlIn.appendChild(b);c.node=b;
});
ARCS.forEach((a,ai)=>{const ids=NODES.map((n,i)=>n.arc===ai?i:-1).filter(i=>i>=0);if(!ids.length)return;const el=document.createElement('span');el.className='arc';el.dataset.a=ai;el.dataset.f=ids[0];el.textContent=a;$('#arcs').appendChild(el)});
const trackEl=$('.track');let CEN=[],C0=0;
function layoutTrack(){CEN=NODES.map(c=>c.node.offsetLeft+c.node.offsetWidth/2);C0=CEN[0]||0;trackEl.style.left=C0+'px';trackEl.style.width=Math.max(0,(CEN[N-1]||0)-C0)+'px';document.querySelectorAll('.arc').forEach(el=>{el.style.left=NODES[+el.dataset.f].node.offsetLeft+'px'})}
layoutTrack();addEventListener('resize',layoutTrack);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutTrack);
R.forEach((r,i)=>{if(SKIP.has(i))return;const d=document.createElement('div');d.className='rl';d.textContent=r;d.dataset.i=i;rail.appendChild(d)});
(function buildMap(){
  const r0=rng(3),st=Array.from({length:50},()=>`<circle cx="${(r0()*400).toFixed(1)}" cy="${(r0()*250).toFixed(1)}" r="${(r0()*.8+.2).toFixed(2)}" fill="#fff" opacity="${(.15+r0()*.3).toFixed(2)}"/>`).join('');
  const nodes=Object.entries(MAPN).map(([k,n])=>`<g class="mn" data-k="${k}"><circle cx="${n.x}" cy="${n.y}" r="3.2"/><text x="${n.x}" y="${n.y+13}" text-anchor="middle">${n.n}</text></g>`).join('');
  mapEl.innerHTML=`<div class="cap"><span>地理 · 示意</span><b id="mapCur"></b></div>
  <svg viewBox="0 0 400 250" aria-label="王林足迹示意图">${st}
   <ellipse class="region" cx="128" cy="146" rx="118" ry="96"/><text class="rname" x="128" y="62" text-anchor="middle">朱 雀 星</text>
   <circle class="region" cx="296" cy="172" r="50"/><text class="rname" x="296" y="133" text-anchor="middle">星 域</text>
   <ellipse class="region" cx="352" cy="76" rx="44" ry="42"/><text class="rname" x="352" y="28" text-anchor="middle">罗天星域</text>
   <polyline class="route" id="route" points=""/>
   ${nodes}<circle class="ping" id="ping" cx="0" cy="0" r="4"/></svg>`;
})();

const CNA='一二三四五六七八';
function showCard(c){const el=$('#card');el.querySelector('small').textContent=c.prologue?'原著 耳根 · 动画 腾讯视频':c.tbd?'院线剧场版 · 待映':'剧场版';el.querySelector('b').textContent=c.title;el.querySelector('span').textContent=c.prologue?'剧情长卷':c.tbd?'档期待官方公布':c.film+' 上线';el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function showToast(c){const el=$('#toast');el.querySelector('b').textContent=R[c.realm];el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  const re=rail.querySelector(`.rl[data-i="${c.realm}"]`);if(re){re.classList.remove('pulse');void re.offsetWidth;re.classList.add('pulse')}}
const Timeline={
  idx:-1,auto:false,t0:0,pausedAt:0,
  dwell(c){return c.end?9e9:this.hold},
  go(i){
    i=Math.max(0,Math.min(N-1,i));if(i===this.idx)return;
    const prev=this.idx>=0?NODES[this.idx]:null,c=NODES[i],fwd=i>this.idx;
    this.idx=i;this.t0=performance.now();this.pausedAt=0;
    document.documentElement.style.setProperty('--accent',c.accent);
    Music.setMood(c.mood);if(prev)Music.swell();
    const realmUp=!!(prev&&fwd&&c.realm>prev.realm&&!c.tbd);
    const instant=!prev||document.hidden;
    const onArrive=()=>{if(realmUp){showToast(c);GL&&GL.burst(c.accent);Music.rise()}};
    if(GL)GL.go(c.env,{instant,shot:c.shot||0,onSwap:()=>{if(c.film||c.prologue)showCard(c)},onArrive});
    else{const e=ENV[c.env];$('#stage').style.background=`linear-gradient(180deg,${e.sky[0]},${e.sky[1]} 55%,${e.sky[2]})`;if(c.film||c.prologue)showCard(c);onArrive()}
    content.querySelectorAll('.panel').forEach(p=>{p.classList.add('out');setTimeout(()=>p.remove(),750)});
    const p=document.createElement('div');p.className='panel';
    const D0=c.prologue?3:instant?.2:(c.film?3.2:1.25/SPEED),d=n=>`style="--d:${(D0+n/SPEED).toFixed(2)}s"`,L=c.lines.length;
    // 最后出现的是出处一栏（动画 1 秒），全部出现后再停 3 秒
    this.hold=(D0+(.9+L*1.05)/SPEED+1+3)*1000;
    const lines=c.lines.map((l,k)=>`<p class="ln" ${d(.9+k*1.05)}>${l}</p>`).join('');
    let slate=`<span>出处<b>${c.src}</b></span>`;
    if(c.film)slate=`<span>${c.tbd?'状态':'上线'}<b>${c.film}</b></span>`+slate;
    if(c.foe){const base=c.fromRealm??c.realm;let gap=0;if(c.foe.r>=0)for(let k=base+1;k<=c.foe.r;k++)if(k!==13)gap++;slate+=`<span class="foe">对手<b>${c.foe.n}${c.foe.r>=0?' · '+R[c.foe.r]:''}</b>${gap>0?`<em class="gap">越 ${gap} 境</em>`:''}</span>`}
    p.innerHTML=`
      <div class="bigch">${c.kw}</div>
      <div class="meta ln" ${d(0)}>
        <span class="chip no">${c.end?'终章':c.label}</span>
        ${c.film?`<span class="chip movie">${c.tbd?'院线剧场版':'剧场版'}</span>`:''}${c.novel?'<span class="chip novel">原著小说</span>':''}
        <span class="chip loc">${c.place||MAPN[c.map].n}</span>
        <span class="chip rlm">${c.realmNote||R[c.realm]}</span>
      </div>
      <h1 class="ti ln ${c.title.length>4?'long':''}" ${d(.2)}>${c.title}</h1>
      <div class="sub ln" ${d(.5)}>${c.prologue?'序章　动画剧情长卷':'第'+CNA[c.arc-1]+'卷　'+ARCS[c.arc]}</div>
      <div class="txt">${lines}</div>
      <div class="slate ln" ${d(.9+L*1.05)}>${slate}</div>
      ${c.end?`<button type="button" class="again ln" ${d(1.4+L*1.05)} id="again">↻　重温</button>`:''}`;
    content.appendChild(p);fitPanel(p);
    const ag=p.querySelector('#again');if(ag)ag.onclick=()=>{this.auto=true;this.go(0);Music.resume()};
    cards.innerHTML='<div class="cards-h">关键人物</div>'+c.chars.map((h,n)=>`<div class="card${h.enemy?' enemy':''}" style="--d:${(D0+(.5+n*.3)/SPEED).toFixed(2)}s"><div class="seal">${h.g}</div><div><div class="n">${h.n}</div><div class="r">${h.r}</div><div class="d">${h.d}</div></div></div>`).join('');
    NODES.forEach((cc,k)=>{cc.node.classList.toggle('cur',k===i);cc.node.classList.toggle('seen',k<=i)});
    document.querySelectorAll('.arc').forEach(a=>a.classList.toggle('cur',+a.dataset.a===c.arc));
    const tl=$('#tl');tl.scrollTo({left:c.node.offsetLeft-tl.clientWidth/2+c.node.offsetWidth/2,behavior:prev?'smooth':'auto'});
    rail.querySelectorAll('.rl').forEach(e=>{const k=+e.dataset.i;e.classList.toggle('cur',k===c.realm);e.classList.toggle('got',k<c.realm&&!SKIP.has(k));e.classList.toggle('foe',!!(c.foe&&c.foe.r===k))});
    const seq=[];NODES.slice(0,i+1).forEach(x=>{if(seq[seq.length-1]!==x.map)seq.push(x.map)});
    $('#route').setAttribute('points',seq.map(k=>MAPN[k].x+','+MAPN[k].y).join(' '));
    mapEl.querySelectorAll('.mn').forEach(g=>{g.classList.toggle('seen',seq.includes(g.dataset.k));g.classList.toggle('cur',g.dataset.k===c.map)});
    const mp=MAPN[c.map],pg=$('#ping');pg.setAttribute('cx',mp.x);pg.setAttribute('cy',mp.y);$('#mapCur').textContent=mp.n;
    $('#count').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${N}`;
    this.sync();
  },
  next(){if(this.idx<N-1)this.go(this.idx+1);else{this.auto=false;this.sync()}},
  prev(){this.go(this.idx-1)},
  toggle(){this.auto=!this.auto;if(this.auto)this.t0=performance.now()-(this.pausedAt||0);else this.pausedAt=performance.now()-this.t0;this.sync()},
  sync(){const c=NODES[this.idx];$('#bPlay').textContent=c&&c.end?(this.auto?'↻ 重播':'▶ 放映'):(this.auto?'❚❚ 暂停':'▶ 放映');Music.setPlaying(this.auto)},
  tick(now){
    if(this.idx<0)return;const c=NODES[this.idx];let frac=0;const el=now-this.t0;
    if(this.auto&&!c.end){frac=Math.min(1,el/this.dwell(c));if(el>=this.dwell(c))this.next()}
    else if(!this.auto)frac=Math.min(1,(this.pausedAt||0)/this.dwell(c));
    if(GL)GL.setProg(this.auto&&!c.end?frac:Math.min(1,el/26000));
    {const cur=CEN[this.idx]||0,nx=CEN[Math.min(N-1,this.idx+1)]||cur;fillEl.style.width=Math.max(0,cur+(nx-cur)*(c.end?0:frac)-C0)+'px'}
  }
};

/* ====================== 主循环与控制 ====================== */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(GL){GL.update(dt);GL.render();GL.adapt(dt)}Timeline.tick(now);requestAnimationFrame(loop)}
$('#bPrev').onclick=()=>{Timeline.prev();Music.resume()};
$('#bNext').onclick=()=>{Timeline.next();Music.resume()};
$('#bPlay').onclick=()=>{const c=NODES[Timeline.idx];Music.resume();if(c.end){Timeline.auto=true;Timeline.go(0)}else Timeline.toggle()};
$('#bMusic').onclick=()=>{Music.start();Music.resume();Music.toggle()};
$('#bFull').onclick=fs;
$('#bHome').onclick=e=>{if(window.parent!==window){e.preventDefault();try{window.parent.history.back()}catch(_){location.href='../'}}};
function fs(){try{if(document.fullscreenElement)document.exitFullscreen();else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(!r)note2('当前环境不支持全屏');else r.catch(()=>note2('当前环境不支持全屏'))}}catch(e){note2('当前环境不支持全屏')}}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown')Timeline.next();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')Timeline.prev();
  else if(e.key===' '){e.preventDefault();$('#bPlay').click()}
  else if(e.key==='m'||e.key==='M')$('#bMusic').click();
  else if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='Home')Timeline.go(0);else if(e.key==='End')Timeline.go(N-1);
});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60&&!e.target.closest('.tl,#cards,.bar'))dx<0?Timeline.next():Timeline.prev()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(Timeline.auto)Timeline.pausedAt=performance.now()-Timeline.t0}else{if(Timeline.auto)Timeline.t0=performance.now()-(Timeline.pausedAt||0);last=performance.now()}Music.setHidden(document.hidden)});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>GL&&GL.resize(),120)});

// 声音被浏览器拦住时：每次触屏/点击都尝试解锁，直到真正出声为止
const UNLOCK_EV=['touchend','click','pointerup','keydown'];
function tryUnlock(){if(Music.state!=='running')Music.unlock()}
function audioHint(){if(Music.state==='running'||Music.state==='none')return;const n=$('#note');n.textContent='轻触屏幕开启配乐';n.classList.add('show')}
function audioOk(){if(Music.state!=='running')return;$('#note').classList.remove('show');UNLOCK_EV.forEach(t=>removeEventListener(t,tryUnlock,true))}
$('#app').classList.remove('pre');
if(!Music.start())note2('当前浏览器不支持音频');
else{UNLOCK_EV.forEach(t=>addEventListener(t,tryUnlock,true));Music.onState(audioOk)}
Timeline.auto=true;Timeline.go(0);
setTimeout(audioHint,700);
requestAnimationFrame(loop);
})();
</script>
